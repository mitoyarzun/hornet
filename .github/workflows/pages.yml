name: Web build

# Build the web version of the game and publish it on GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TRUNK_VERSION: 0.21.14
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Install Trunk
        run: |
          archive=trunk-x86_64-unknown-linux-gnu.tar.gz
          base=https://github.com/trunk-rs/trunk/releases/download/v$TRUNK_VERSION
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/$archive.sha256"
          echo "$(tr -d '[:space:]' < "$archive.sha256")  $archive" | sha256sum -c -
          mkdir -p "$HOME/.cargo/bin"
          tar -xzf "$archive" -C "$HOME/.cargo/bin" trunk
      - name: Build the web version
        env:
          PUBLIC_URL: /${{ github.event.repository.name }}/
        run: tools/build-web.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
