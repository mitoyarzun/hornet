name: Release builds

# Push a tag such as v0.1.0 to build and publish a release.
# Run the workflow by hand to build the archives without a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build patched Systemless
        env:
          TARGET: ${{ matrix.target }}
        run: tools/setup-systemless.sh
      - name: Build the launcher
        run: cargo build --locked --release --target '${{ matrix.target }}' --manifest-path launcher/Cargo.toml
      - name: Run the Systemless library tests
        run: cd out/systemless && cargo test --locked --profile ci-test --lib --target '${{ matrix.target }}'
      - name: Package
        run: tools/package-release.sh '${{ matrix.target }}' "$VERSION"
      - name: Package corresponding source
        if: matrix.target == 'aarch64-apple-darwin'
        run: tools/package-release.sh source "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --generate-notes *
