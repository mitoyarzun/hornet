[package]
name = "hornet-launcher"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Double-click launcher for F/A-18 Hornet 2.0 on Systemless"
publish = false

[dependencies]
rfd = "0.17"
dirs = "7"
eframe = "0.31"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent"] }

# Build scripts run on the build host: embed the icon on Windows builds.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
