[package]
name = "hornet-launcher"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Double-click launcher for F/A-18 Hornet 2.0 on Systemless"
publish = false

[dependencies]
rfd = "0.17"
dirs = "7"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDate", "NSObjCRuntime", "NSRunLoop", "NSString"] }

[profile.release]
strip = true
